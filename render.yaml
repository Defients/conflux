# Render Blueprint — Conflux Circuit Colyseus Server
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: conflux-circuit-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://confluxcircuit.com,https://www.confluxcircuit.com
